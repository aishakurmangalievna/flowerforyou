    .lined {

    .booking-form input,

      margin-bottom: 12px;  

      border: 1px solid #bf7e81;  

      border-radius: 6px;  

      font-family: inherit;  

    }  



    .booking-form button {  

      background-color: #bf7e81;  

      color: white;  

      border: none;  

      padding: 10px;  

      width: 100%;  

      border-radius: 8px;  

      font-size: 16px;  

      cursor: pointer;  

      transition: 0.3s;  

    }  



    .booking-form button:hover {  

      background-color: #74040e;  

    }  



    .my-image-section {  

      display: flex;  

      flex-wrap: wrap;  

      gap: 20px;  

      justify-content: center;  

      margin-bottom: 40px;  

    }  



    .my-image-card {  

      background-color: #fff;  

      border-radius: 10px;  

      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);  

      padding: 10px;  

      width: 220px;  

      text-align: center;  

      transition: transform 0.2s;  

    }  



    .my-image-card:hover {  

      transform: scale(1.03);  

    }  



    .my-image-card img {  

      width: 100%;

      border-radius: 8px;  

    }  



    .my-image-card h3 {

    }  



    .video-block {

    .video-block iframe {

    .gallery {  

      display: grid;  

      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

    #top { display: block; }

<body>

  <div class="filter-section">

    <h3 class="lined">Фильтр букетов</h3>

    <div class="filter-buttons">

      <button class="filter-btn active" data-filter="all">Все букеты</button>

  <section id="booking">

        <input type="date" id="date" name="date" required />

        src="https://www.youtube.com/embed/BTFJQqiE1Dw?autoplay=1&mute=1&loop=1&playlist=BTFJQqiE1Dw"

  <a href="#top" class="top-btn">Наверх</a>

  <script>

    document.addEventListener('DOMContentLoaded', function() {

      const filterButtons = document.querySelectorAll('.filter-btn');

      const filterItems = document.querySelectorAll('.filter-item');

      

      filterButtons.forEach(button => {

        button.addEventListener('click', function() {

          filterButtons.forEach(btn => btn.classList.remove('active'));

          this.classList.add('active');

          

          const filterValue = this.getAttribute('data-filter');

          

          filterItems.forEach(item => {

            if (filterValue === 'all') {

              item.classList.remove('hidden');

            } else {

              if (item.getAttribute('data-category').includes(filterValue)) {

                item.classList.remove('hidden');

              } else {

                item.classList.add('hidden');

              }

            }

          });

        });

      });

    });

  </script>

<script>

document.querySelectorAll('a[href^="#"]').forEach(link => {

  link.addEventListener('click', function(e) {

    e.preventDefault();

    const target = document.querySelector(this.getAttribute('href'));

    if (target) {

      window.scrollTo({

        top: target.offsetTop,

        behavior: "smooth"

      });

    }

  });

});



const revealElements = document.querySelectorAll(

  "section, .my-image-section, .gallery, .video-block, .map-wrapper"

);



function revealOnScroll() {

  let windowHeight = window.innerHeight;



  revealElements.forEach(el => {

    let revealTop = el.getBoundingClientRect().top;

    if (revealTop < windowHeight - 120) {

      el.classList.add("show");

    }

  });



  document.querySelectorAll(".my-image-card").forEach(card => {

    let revealTop = card.getBoundingClientRect().top;

    if (revealTop < windowHeight - 120) {

      card.classList.add("visible");

    }

  });

}



window.addEventListener("scroll", revealOnScroll);

window.addEventListener("load", revealOnScroll);

</script>

<style>

section, .my-image-section, .gallery, .video-block, .map-wrapper {

  opacity: 0;

  transform: translateY(30px);

  transition: all 1s ease;

}



.show {

  opacity: 1;

  transform: translateY(0);

}

.filter-btn:hover,

.booking-form button:hover,

.top-btn:hover {

  animation: pulse 0.4s ease-out;

}



@keyframes pulse {

  0% { transform: scale(1); }

  60% { transform: scale(1.08); }

  100% { transform: scale(1); }

}



.my-image-card {

  opacity: 0;

  transform: scale(0.8);

  transition: all 0.8s ease;

}



.my-image-card.visible {

  opacity: 1;

  transform: scale(1);

}



.gallery img:hover {

  transform: scale(1.1) rotate(1deg);

  transition: .4s ease;

}



</style>

<!-- Цветочный курсор -->

<div id="flower-cursor">

  <svg width="40" height="40" viewBox="0 0 100 100">

    <g transform="translate(50,50)">

      <ellipse cx="0" cy="-25" rx="12" ry="24" fill="#ff7ab6"/>

      <ellipse cx="0" cy="-25" rx="12" ry="24" fill="#ffd17a" transform="rotate(45)"/>

      <ellipse cx="0" cy="-25" rx="12" ry="24" fill="#ff7ab6" transform="rotate(90)"/>

      <ellipse cx="0" cy="-25" rx="12" ry="24" fill="#ffd17a" transform="rotate(135)"/>

    </g>

    <circle cx="50" cy="50" r="11" fill="#fff3c4"/>

  </svg>

</div>



<style>

  /* Полное отключение стандартного курсора */

  * {

    cursor: none !important;

  }



  #flower-cursor {

    position: fixed;

    width: 40px;

    height: 40px;

    pointer-events: none;

    top: 0;

    left: 0;

    transform: translate(-50%, -50%);

    transition: transform 0.08s linear;

    z-index: 9999;

  }

</style>



<script>

  const flower = document.getElementById("flower-cursor");



  document.addEventListener("mousemove", (e) => {

    flower.style.left = e.clientX + "px";

    flower.style.top = e.clientY + "px";

  });

</script>





</body>
